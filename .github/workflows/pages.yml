name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # lets you re-deploy from the Actions tab

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate curriculum data
        run: node tools/validate.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .            # this is a static, no-build site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
